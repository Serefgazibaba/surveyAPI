# Yerel geliştirme ortamı: PostgreSQL + API + Ön yüz (nginx).
#   Hepsi:          docker compose up --build        → http://localhost:3000
#   Ön yüz hariç:   docker compose up --build api    (ön yüzü npm run dev ile çalıştırmak için)
#   Yalnızca DB:    docker compose up -d postgres   (API'yi IDE / mvnw ile çalıştırmak için)
# Değerler aynı klasördeki .env dosyasından okunur (.env.example'ı kopyalayın).
services:
  postgres:
    image: postgres:16-alpine
    container_name: survey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-survey}
      POSTGRES_USER: ${DB_USERNAME:-survey}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env dosyasında tanımlanmalı}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - survey-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: survey-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-survey}
      DB_USERNAME: ${DB_USERNAME:-survey}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env dosyasında tanımlanmalı}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      # SMTP (davet e-postaları)
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Survey Tool}
      # Oturum / kilit kuralları (test için kısaltılabilir)
      AUTH_SESSION_IDLE_TIMEOUT: ${AUTH_SESSION_IDLE_TIMEOUT:-30m}
      AUTH_MAX_FAILED_ATTEMPTS_PER_IP: ${AUTH_MAX_FAILED_ATTEMPTS_PER_IP:-5}
      AUTH_MAX_FAILED_ATTEMPTS_PER_ACCOUNT: ${AUTH_MAX_FAILED_ATTEMPTS_PER_ACCOUNT:-20}
      # nginx arkasında gerçek istemci IP'si X-Forwarded-For'dan okunur (IP başına giriş kilidi için)
      SERVER_FORWARD_HEADERS_STRATEGY: native
    ports:
      - "${SERVER_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    container_name: survey-frontend
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  survey-pgdata:
