# Yerel geliştirme profili (varsayılan).
spring:
  jpa:
    hibernate:
      # Migration aracı olmadığı için şema entity'lerden üretilir. Yalnızca geliştirme içindir.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Swagger UI: http://localhost:8080/api/v1/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.definex.survey: DEBUG
    org.springframework.security: INFO
