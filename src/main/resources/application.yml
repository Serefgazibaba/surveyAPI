# Ortak yapılandırma. Gizli bilgiler (DB şifresi, JWT secret) yalnızca environment variable'dan okunur.
spring:
  application:
    name: survey-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/survey}
    username: ${DB_USERNAME:survey}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-stacktrace: never
    include-message: never

# Swagger UI varsayılan olarak kapalı; dev profilinde açılır.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: survey-api
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
