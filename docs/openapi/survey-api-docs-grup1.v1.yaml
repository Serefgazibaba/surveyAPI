  /admin/createSurveyFromTemplate:
    post:
      tags: [Admin - Templates]
      operationId: adminCreateSurveyFromTemplate
      summary: Şablondan anket oluştur
      description: |
        Şablonun içeriğiyle yeni **taslak** (`DRAFT`) anket oluşturur. Sorular ve seçenekler yeni id'lerle yazılır;
        yanıt `upsertSurvey` ile aynıdır ve anket bundan sonra `upsertSurvey` ile düzenlenir.
        - `title` boşsa şablonun adı kullanılır; açıklama şablondan alınır.
        - Bitiş tarihi ve yanıt modu boş gelir; yayınlamadan önce doldurulur.
        - Anket ile şablon arasında bağ tutulmaz: şablon sonradan değişse veya silinse anket etkilenmez.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyFromTemplateRequest'
            example:
              templateId: 5c1e8f3a-2b7d-4e9a-b6c4-1d3f5a7e9b20
              title: Eğitim Değerlendirme — Kasım 2026
      responses:
        '201':
          description: Taslak anket oluşturuldu
          headers:
            Location:
              description: Oluşturulan anketin adresi (`/admin/surveys/{surveyId}`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/reports:
    get:
      tags: [Admin - Reports]
      operationId: adminListReports
      summary: Tüm raporlar
      description: |
        Admin'in taslak olmayan anketlerinin özet sayıları, son güncellenen önce (FR-70, BR-09).
        - Katılım oranı = yanıt / maili başarıyla gönderilen (`SENT`) davet × 100, bir ondalık (BR-10); payda 0 ise `0`.
        - Yalnızca gönderilmiş yanıtlar sayılır; ara kayıtlar hariçtir (BR-03).
        - `status=DRAFT` gönderilirse `400` (taslak anketin raporu yoktur).
      security:
        - adminAuth: []
      parameters:
        - name: q
          in: query
          description: Anket başlığında arama (büyük/küçük harf duyarsız)
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          description: Durum filtresi; birden çok verilebilir. Verilmezse `PUBLISHED`, `EXPIRED`, `CLOSED`, `ARCHIVED`.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SurveyStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Rapor listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/reports/{surveyId}:
    parameters:
      - $ref: '#/components/parameters/SurveyId'
    get:
      tags: [Admin - Reports]
      operationId: adminGetReport
      summary: Rapor detayı
      description: |
        Anketin raporu tek yanıtta döner; göstergeler anlık hesaplanır (FR-70). Metin cevaplarında arama ve sayfalama
        istemcide yapılır (FR-72).
        - `summary`: davet, gönderilen davet, yanıt, katılım oranı (BR-10), ortalama memnuniyet, ortalama tamamlama süresi.
          Ortalama memnuniyet, farklı ölçekli Likert soruları birlikte ortalanabilsin diye her cevabın 1–5 ölçeğine
          çevrilmiş ortalamasıdır; soru bazındaki `average` sorunun kendi ölçeğindedir.
        - `questions`: soru bazlı dağılımlar (FR-71). Yüzdeler soruyu yanıtlayan kişi sayısına göredir; çoklu seçimde
          toplam %100'ü aşabilir. Serbest metin ve "Diğer" metinleri en yeni önce, tamamı döner. Metinler ham döner;
          istemci HTML olarak değil düz metin olarak göstermelidir (NFR-05).
        - `responses`: katılımcı bazlı yanıtlar, **yalnızca kayıtlı modda** (FR-74). Anonim modda alan yanıtta yer almaz ve
          kimlik bilgisi hiçbir alanda dönmez (BR-06).
        - Yalnızca gönderilmiş yanıtlar dahildir; ara kayıtlar hariçtir (BR-03). Az yanıtta kırılım gizleme (BR-07) uygulanmaz.
        - Taslak anket → `409 REPORT_NOT_AVAILABLE`.
      security:
        - adminAuth: []
      responses:
        '200':
          description: Anket raporu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReportNotAvailable'

  /admin/reports/{surveyId}/download:
    parameters:
      - $ref: '#/components/parameters/SurveyId'
    get:
      tags: [Admin - Reports]
      operationId: adminDownloadReport
      summary: Raporu kaydet (CSV)
      description: |
        Ham yanıtları CSV olarak indirir (FR-73, AS-06). PDF, rapor ekranının tarayıcıdan yazdırılmasıyla alınır.
        - Her yanıt bir satır, her soru bir sütun; UTF-8 BOM ile (Excel'de Türkçe karakterler korunur), ayraç `;`,
          RFC 4180 tırnaklama. `= + - @` ile başlayan hücrelere `'` eklenir (formül enjeksiyonu önlemi).
        - Sütunlar: kayıtlı modda `Ad Soyad`, `E-posta`; ardından `Gönderim (Europe/Istanbul)`, `Süre (sn)`,
          `S1. <soru>` … Anonim modda kimlik sütunu yoktur ve gönderim zamanı saat hassasiyetindedir (BR-06).
        - Hücreler okunur metindir: Likert puanı; seçenek etiketleri `, ` ile, "Diğer: …" dahil; serbest metin.
        - Dosya akış olarak yazılır (NFR-13). Taslak anket → `409 REPORT_NOT_AVAILABLE`.
      security:
        - adminAuth: []
      responses:
        '200':
          description: CSV dosyası
          headers:
            Content-Disposition:
              description: 'Dosya adı, ör. `attachment; filename*=UTF-8''''2026-q4-calisan-memnuniyeti-yanitlar.csv`'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReportNotAvailable'

  # =====================================================================
  # USER (KATILIMCI)
  # =====================================================================
  /user/auth/login:
    post:
      tags: [User - Auth]
      operationId: userLogin
      summary: Katılımcı girişi (davet tokenı ile)
      description: |
        Davet mailindeki linkte yer alan davet tokenını, tek bir davete ve ankete bağlı katılımcı token'ına çevirir
        (FR-60). Katılımcı hesap açmaz, şifre girmez; davet tokenı kimlik yerine geçer.

        - Sunucu davet tokenının hash'ini arar (NFR-02); davet, katılımcı ve anket bu kayıttan bulunur.
        - Token **anketin bitiş tarihine kadar** geçerlidir (`exp` = `endsAt`). Refresh yoktur.
          JWT claim'leri: `sub` = kullanıcı, `roles` = `[USER]`, `inv` = davet, `svy` = anket.
        - Davet ilk kez açılıyorsa `PENDING` → `STARTED` olur. Davet tokenı burada **tüketilmez**;
          katılımcı gönderime kadar aynı linkle tekrar girebilir (BR-02).

        **Erişim kuralları** (burada ve her `/user/**` isteğinde aynı; JWT geçerli olsa bile DB'den yeniden kontrol edilir)
        | Durum | HTTP | `code` |
        |---|---|---|
        | Token bulunamadı veya davet iptal | 401 | `INVALID_INVITATION` |
        | Bitiş tarihi geçti veya anket `EXPIRED` | 410 | `SURVEY_EXPIRED` |
        | Anket `CLOSED` / `ARCHIVED` | 410 | `SURVEY_CLOSED` |
        | Yanıt zaten gönderildi | 409 | `ALREADY_RESPONDED` |

        Hata yanıtları hata sayfası (S-10) için `surveyTitle` taşır (davet bulunamadıysa boş). `contactInfo` ileride dolacak.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
            example:
              invitationToken: 'q7Zx0bR3kN9vYpL2mT6sWc1eHfJ4uAaD8gKiOn5rXyQ'
      responses:
        '200':
          description: Oturum açıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Davet linki geçersiz veya iptal edilmiş
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UserAccessProblem'
              example:
                type: https://survey.example.com/problems/invalid-invitation
                title: Bu davet linki geçersiz
                status: 401
                code: INVALID_INVITATION
        '409':
          $ref: '#/components/responses/AlreadyResponded'
        '410':
          $ref: '#/components/responses/SurveyNotAvailable'

  /user/surveys/{surveyId}:
    parameters:
      - $ref: '#/components/parameters/SurveyId'
    get:
      tags: [User - Surveys]
      operationId: userGetSurvey
      summary: Anket formu (Katılımcı)
      description: |
        Katılımcının dolduracağı formu döner (FR-60, FR-61). Admin'e özel alanlar (katılımcı sayısı, aksiyonlar,
        sürüm vb.) yer almaz.
        - `draft` alanı ara kayıt uçlarıyla birlikte dolacak (FR-63, AS-02); şimdilik `null`.
        - Anonim modda `anonymousNotice` formun başında gösterilir (FR-67).
        - `surveyId` katılımcı token'ının bağlı olduğu anketle (`svy`) eşleşmezse `404` döner.
        - Erişim kuralları login ile aynıdır (409 / 410 / 401).
      security:
        - userAuth: []
      responses:
        '200':
          description: Anket formu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSurvey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyResponded'
        '410':
          $ref: '#/components/responses/SurveyNotAvailable'

  /user/surveys/{surveyId}/draft:
    parameters:
      - $ref: '#/components/parameters/SurveyId'
    put:
      tags: [User - Surveys]
      operationId: userSaveDraft
      summary: Ara kayıt
      description: |
        Katılımcının o ana kadarki yanıtlarını ara kayıt olarak saklar; soru/sayfa geçişlerinde çağrılır (FR-63).
        Gönderilen `answers` mevcut taslağın **tamamını** değiştirir. Zorunlu soru kontrolü burada yapılmaz.
        Ara kayıt `GET /user/surveys/{surveyId}` yanıtındaki `draft` alanında döner (kaldığı yerden devam).
        Ara kayıtlar rapora dahil edilmez (BR-03). Erişim kuralları login ile aynıdır (409 / 410 / 401).

        **Cevap kuralları** (ara kayıt ve gönderim için aynı; ihlal → `422 INVALID_ANSWERS`, `errors[].field` = `answers[i]…`)
        | Tip | Alanlar | Kural |
        |---|---|---|
        | `LIKERT` | `numericValue` | 1..`scale` |
        | `SINGLE_CHOICE` | `optionIds` (≤1) veya `otherText` | seçenek bu soruya ait; `otherText` yalnızca `allowOther`; ikisi birlikte olamaz |
        | `MULTIPLE_CHOICE` | `optionIds` + `otherText` | seçenekler bu soruya ait ve tekrarsız; toplam seçim `minSelect`..`maxSelect` ("Diğer" dahil) |
        | `FREE_TEXT` | `text` | ≤ `maxLength` |

        `questionId` ankette olmalı ve bir kez gelmeli; tipe ait olmayan alan dolu olamaz. Hiçbir alanı dolu olmayan
        cevap yanıtlanmamış sayılır.
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDraftRequest'
            example:
              currentQuestionId: 1c4f7b63-9e1d-4a7c-8b9f-4a3e2d8c6b21
              answers:
                - questionId: 1c4f7b63-9e1d-4a7c-8b9f-4a3e2d8c6b21
                  numericValue: 4
      responses:
        '200':
          description: Ara kayıt saklandı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDraftResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyResponded'
        '410':
          $ref: '#/components/responses/SurveyNotAvailable'
        '422':
          $ref: '#/components/responses/InvalidAnswers'

  /user/surveys/{surveyId}/submit:
    parameters:
      - $ref: '#/components/parameters/SurveyId'
    post:
      tags: [User - Surveys]
      operationId: userSubmitSurvey
      summary: Anketi gönder
      description: |
        Yanıtı kesinleştirir (FR-64).
        - `answers` nihai yanıtların **tamamıdır**; ara kayıtla birleştirilmez.
        - Önce değerler kontrol edilir (`422 INVALID_ANSWERS`), ardından zorunlu sorular
          (`422 REQUIRED_ANSWERS_MISSING`; `errors[].field` eksik sorunun `questionId`'si, FR-62).
        - Başarılı gönderimde davet `COMPLETED` olur ve ara kayıt silinir. Bu link ve daha önce alınmış katılımcı
          token'ı ile sonraki her istek `409 ALREADY_RESPONDED` alır (BR-01, BR-02).
        - **Anonim modda** (BR-06) yanıt davetle ilişkilendirilmez ve gönderim zamanı saat başına yuvarlanır; böylece
          davetin tamamlanma zamanıyla eşleştirilip kişi tahmin edilemez. Kayıtlı modda yanıt davete bağlıdır.
        - Bitiş tarihi geçtiyse yanıt alınmaz (`410`, BR-03).
        - Aynı anda gelen iki gönderimden yalnızca biri kabul edilir; tekrar gönderim (ör. ağ hatası sonrası)
          `409 ALREADY_RESPONDED` alır — ön yüz bunu "zaten gönderildi" olarak göstermelidir.

        **Cevap kuralları** (ara kayıt ve gönderim için aynı; ihlal → `422 INVALID_ANSWERS`, `errors[].field` = `answers[i]…`)
        | Tip | Alanlar | Kural |
        |---|---|---|
        | `LIKERT` | `numericValue` | 1..`scale` |
        | `SINGLE_CHOICE` | `optionIds` (≤1) veya `otherText` | seçenek bu soruya ait; `otherText` yalnızca `allowOther`; ikisi birlikte olamaz |
        | `MULTIPLE_CHOICE` | `optionIds` + `otherText` | seçenekler bu soruya ait ve tekrarsız; toplam seçim `minSelect`..`maxSelect` ("Diğer" dahil) |
        | `FREE_TEXT` | `text` | ≤ `maxLength` |

        `questionId` ankette olmalı ve bir kez gelmeli; tipe ait olmayan alan dolu olamaz. Hiçbir alanı dolu olmayan
        cevap yanıtlanmamış sayılır.
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSubmitRequest'
            example:
              answers:
                - questionId: 1c4f7b63-9e1d-4a7c-8b9f-4a3e2d8c6b21
                  numericValue: 4
                - questionId: 2d5a8c74-0f2e-4b8d-9c0a-5b4f3e9d7c32
                  optionIds:
                    - 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    - 8b2c3d4e-5f6a-4b7c-9d8e-0f1a2b3c4d5e
                - questionId: 3e6b9d85-1a3f-4c9e-8d1b-6c5a4f0e8d43
                  text: Eğitim bütçesinin artırılmasını öneriyorum.
      responses:
        '200':
          description: Yanıt alındı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSubmitResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyResponded'
        '410':
          $ref: '#/components/responses/SurveyNotAvailable'
        '422':
          description: '`INVALID_ANSWERS` (değer kurallara uymuyor) veya `REQUIRED_ANSWERS_MISSING` (zorunlu soru eksik)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://survey.example.com/problems/required-answers-missing
                title: Lütfen zorunlu soruları yanıtlayın
                status: 422
                code: REQUIRED_ANSWERS_MISSING
                errors:
                  - field: 4f7c0e96-2b4a-4d0f-9e2c-7d6b5a1f9e54
                    code: REQUIRED
                    message: Bu soru zorunludur

components:
  securitySchemes:
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '`/admin/auth/login` ile alınan, Admin kullanıcısına bağlı token'
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `POST /user/auth/login` ile alınan katılımcı token'ı. Kişisel veri taşımaz; yalnızca davete ve ankete bağlıdır
        (`sub` = kullanıcı id'si, `roles` = `[USER]`, `inv` = davet id'si, `svy` = anket id'si, `exp` = anketin bitiş
        tarihi). Yalnızca `/user/*` uçlarında ve yalnızca `svy` anketi için geçerlidir; refresh yoktur.

  parameters:
    SurveyId:
      name: surveyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Sayfa numarası (1'den başlar)
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      description: Sayfa başına kayıt
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    ValidationError:
      description: İstek formatı veya alan doğrulaması hatalı
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://survey.example.com/problems/validation-error
            title: İstek doğrulanamadı
            status: 400
            code: VALIDATION_ERROR
            errors:
              - field: title
                code: REQUIRED
                message: Başlık zorunludur
    Unauthorized:
      description: Token yok, süresi dolmuş veya bu uç grubu için geçersiz (admin/user)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://survey.example.com/problems/unauthorized
            title: Oturum geçersiz
            status: 401
            code: UNAUTHORIZED
    SessionExpired:
      description: Refresh token geçersiz, süresi dolmuş, iptal edilmiş veya oturum hareketsizlikten sonlanmış
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://survey.example.com/problems/session-expired
            title: Oturum sona erdi
            status: 401
            code: SESSION_EXPIRED
    NotFound:
      description: Anket bulunamadı veya erişim yetkisi yok
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://survey.example.com/problems/not-found
            title: Anket bulunamadı
            status: 404
            code: SURVEY_NOT_FOUND
    InvalidAnswers:
      description: Cevap değerleri soru kurallarına uymuyor
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://survey.example.com/problems/invalid-answers
            title: Bazı cevaplar geçersiz
            status: 422
            code: INVALID_ANSWERS
            errors:
              - field: answers[0].numericValue
                code: OUT_OF_RANGE
                message: 1 ile 5 arasında olmalı
    ReportNotAvailable:
      description: Taslak anket için rapor yoktur
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://survey.example.com/problems/report-not-available
            title: Taslak anket için rapor oluşturulamaz
            status: 409
            code: REPORT_NOT_AVAILABLE
    TooManyRequests:
      description: Çok fazla istek
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AlreadyResponded:
      description: Katılımcı bu anketi zaten yanıtladı (AS-01)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UserAccessProblem'
          example:
            type: https://survey.example.com/problems/already-responded
            title: Bu anketi zaten yanıtladınız
            status: 409
            code: ALREADY_RESPONDED
            surveyTitle: 2026 Q4 Çalışan Memnuniyeti
    SurveyNotAvailable:
      description: |
        Anket artık yanıt kabul etmiyor (AS-03).
        `code`: `SURVEY_EXPIRED` (bitiş tarihi geçti) veya `SURVEY_CLOSED` (Admin kapattı)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UserAccessProblem'
          example:
            type: https://survey.example.com/problems/survey-expired
            title: Bu anketin süresi dolmuştur
            status: 410
            code: SURVEY_EXPIRED
            surveyTitle: 2026 Q4 Çalışan Memnuniyeti
            contactInfo: people@definex.com

  schemas:
    # ---------- Ortak ----------
    Problem:
      type: object
      description: RFC 7807 hata gövdesi
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          description: Kullanıcıya gösterilebilir kısa açıklama
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Makine tarafından okunacak hata kodu
          example: VALIDATION_ERROR
        traceId:
          type: string
          description: Log korelasyonu için istek kimliği
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    UserAccessProblem:
      description: Katılımcı erişim hatası; S-10 hata sayfasını beslemek için ek alanlar taşır (FR-65)
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            surveyTitle:
              type: string
              nullable: true
              description: Token geçersizse boş
            contactInfo:
              type: string
              nullable: true
              description: Anket sahibinin iletişim bilgisi
    FieldError:
      type: object
      required: [code, message]
      properties:
        field:
          type: string
          description: Hatanın oluştuğu alan yolu, ör. `questions[2].options[0].id` veya soru kimliği
        code:
          type: string
        message:
          type: string
    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Access token ömrü (saniye)
          example: 900
        refreshToken:
          type: string
        refreshExpiresIn:
          type: integer
          description: |
            Refresh token'ın kalan geçerliliği (saniye): hareketsizlik penceresi (30 dk) ile oturumun 7 günlük
            mutlak ömründen kısa olanı. Her refresh'te baştan başlar.
          example: 1800

    # ---------- Admin Auth ----------
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    AdminAuthTokenResponse:
      description: Admin refresh token ömrü hareketsizlik süresine (30 dk) eşittir ve her yenilemede baştan başlar (FR-02)
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/AdminUser'
    AdminUser:
      type: object
      required: [id, fullName, email, role]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN]

    # ---------- User Auth ----------
    UserLoginRequest:
      type: object
      required: [invitationToken]
      properties:
        invitationToken:
          type: string
          minLength: 1
          maxLength: 256
          description: Davet linkindeki token (`{FRONTEND_BASE_URL}/s/{invitationToken}`; 256 bit rastgele)
    UserLoginResponse:
      type: object
      description: Katılımcı oturumu. Refresh token yoktur; token anketin bitiş tarihine kadar geçerlidir.
      required: [accessToken, tokenType, expiresIn, expiresAt, surveyId, surveyTitle, invitationStatus]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Token'ın kalan ömrü (saniye)
        expiresAt:
          type: string
          format: date-time
          description: Anketin bitiş tarihi (`endsAt`)
        surveyId:
          type: string
          format: uuid
          description: Ön yüzün `GET /user/surveys/{surveyId}` çağrısı için kullanacağı anket kimliği
        surveyTitle:
          type: string
        invitationStatus:
          $ref: '#/components/schemas/InvitationStatus'
      example:
        accessToken: eyJhbGciOiJIUzI1NiJ9...
        tokenType: Bearer
        expiresIn: 2246400
        expiresAt: '2026-11-30T21:00:00Z'
        surveyId: 9a7d3c21-4b8e-4f0a-a1c2-7e5d9b3f2a68
        surveyTitle: Test Anketi - Mail Akışı
        invitationStatus: STARTED

    # ---------- Admin Survey ----------
    SurveyStatus:
      type: string
      description: |
        - `DRAFT` Taslak
        - `PUBLISHED` Yayında
        - `EXPIRED` Süresi Doldu
        - `CLOSED` Kapandı
        - `ARCHIVED` Arşivlendi
      enum: [DRAFT, PUBLISHED, EXPIRED, CLOSED, ARCHIVED]
    ResponseMode:
      type: string
      description: Yayınlandıktan sonra değiştirilemez (BR-05)
      enum: [ANONYMOUS, IDENTIFIED]
    SurveyAction:
      type: string
      description: |
        Mevcut durumda Admin'in yapabileceği aksiyonlar (FR-11). Yalnızca uygulanmış uçların aksiyonları döner;
        diğerleri uçlar eklendikçe gelecek. `DRAFT`: EDIT, PUBLISH, DELETE · `PUBLISHED`: EDIT · diğer: boş.
      enum: [EDIT, PUBLISH, DELETE]

    SurveySummary:
      type: object
      required: [id, title, status, questionCount, participantCount, allowedActions, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/SurveyStatus'
        responseMode:
          allOf:
            - $ref: '#/components/schemas/ResponseMode'
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        questionCount:
          type: integer
        participantCount:
          type: integer
          description: Davet edilen katılımcı sayısı
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyAction'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SurveyListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SurveySummary'
        page:
          $ref: '#/components/schemas/PageMeta'

    SurveyDetail:
      type: object
      description: Değeri olmayan (null) alanlar yanıtta yer almaz.
      required: [id, title, status, participantCount, allowedActions, createdAt, updatedAt, questions]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/SurveyStatus'
        responseMode:
          allOf:
            - $ref: '#/components/schemas/ResponseMode'
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        participantCount:
          type: integer
          description: Davet edilen katılımcı sayısı
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyAction'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'

    SurveySaveRequest:
      type: object
      description: Upsert gövdesi. Yalnızca `title` zorunludur; diğer alanlar taslakta boş olabilir.
      required: [title]
      properties:
        id:
          type: string
          format: uuid
          description: Yoksa yeni anket oluşturulur; varsa bu anket güncellenir
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        endsAt:
          type: string
          format: date-time
          description: Yayınlamada zorunlu ve gelecekte olmalı (FR-20)
        responseMode:
          $ref: '#/components/schemas/ResponseMode'
        questions:
          type: array
          maxItems: 200
          description: Dizi sırası = soru sırası; listede olmayan mevcut sorular silinir
          items:
            $ref: '#/components/schemas/QuestionSaveInput'
    QuestionSaveInput:
      type: object
      description: |
        Taslakta tüm alanlar boş olabilir.
        - `settings` yalnızca `type` doluyken gönderilir; tipe uymayan veya bilinmeyen alan `400` döner.
          Eksik ayarlar varsayılanlarla doldurulur.
        - `options` yalnızca `SINGLE_CHOICE` ve `MULTIPLE_CHOICE` için gönderilir (aksi `422 INVALID_STRUCTURE`).
          Tip seçimliden başka bir tipe değişirse seçenekler silinir.
      properties:
        id:
          type: string
          format: uuid
          description: Mevcut soru için verilir; yeni soruda boş bırakılır
        text:
          type: string
          maxLength: 1000
        type:
          $ref: '#/components/schemas/QuestionType'
        required:
          type: boolean
          default: false
        settings:
          $ref: '#/components/schemas/QuestionSettings'
        options:
          type: array
          maxItems: 100
          description: Dizi sırası = seçenek sırası; listede olmayan mevcut seçenekler silinir
          items:
            $ref: '#/components/schemas/OptionSaveInput'
    OptionSaveInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Mevcut seçenek için verilir; yeni seçenekte boş bırakılır
        label:
          type: string
          maxLength: 200

    # ---------- Question ----------
    QuestionType:
      type: string
      description: MVP soru tipleri. Yeni tipler (slider, matris vb.) eklendiğinde genişler (NFR-20).
      enum: [LIKERT, SINGLE_CHOICE, MULTIPLE_CHOICE, FREE_TEXT]
    Question:
      type: object
      description: Taslakta `text`, `type` ve `settings` boş olabilir (null alanlar yanıtta yer almaz).
      required: [id, number, required, options]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          description: Anket genelinde görünen soru numarası (1'den başlar); sıralama değişince güncellenir (FR-24)
        text:
          type: string
          nullable: true
        type:
          allOf:
            - $ref: '#/components/schemas/QuestionType'
          nullable: true
        required:
          type: boolean
        settings:
          allOf:
            - $ref: '#/components/schemas/QuestionSettings'
          nullable: true
          description: Tip seçiliyse varsayılanlarla tamamlanmış ayarlar
        options:
          type: array
          description: Yalnızca `SINGLE_CHOICE` ve `MULTIPLE_CHOICE` için dolu
          items:
            $ref: '#/components/schemas/Option'
    QuestionSettings:
      description: |
        Soru tipine özel ayarlar. Hangi şemanın geçerli olduğunu sorunun `type` alanı belirler
        (LIKERT → LikertSettings, SINGLE_CHOICE → SingleChoiceSettings, MULTIPLE_CHOICE → MultipleChoiceSettings,
        FREE_TEXT → FreeTextSettings); eşleşme sunucuda tipe göre doğrulanır.
      anyOf:
        - $ref: '#/components/schemas/LikertSettings'
        - $ref: '#/components/schemas/SingleChoiceSettings'
        - $ref: '#/components/schemas/MultipleChoiceSettings'
        - $ref: '#/components/schemas/FreeTextSettings'
    LikertSettings:
      type: object
      title: LikertSettings
      additionalProperties: false
      properties:
        scale:
          type: integer
          minimum: 3
          maximum: 10
          default: 5
        minLabel:
          type: string
          maxLength: 100
          default: Kesinlikle Katılmıyorum
        maxLabel:
          type: string
          maxLength: 100
          default: Kesinlikle Katılıyorum
    SingleChoiceSettings:
      type: object
      title: SingleChoiceSettings
      additionalProperties: false
      properties:
        allowOther:
          type: boolean
          default: false
          description: “Diğer” serbest metin alanı
        display:
          type: string
          enum: [RADIO, DROPDOWN]
          default: RADIO
    MultipleChoiceSettings:
      type: object
      title: MultipleChoiceSettings
      additionalProperties: false
      properties:
        allowOther:
          type: boolean
          default: false
        minSelect:
          type: integer
          minimum: 0
        maxSelect:
          type: integer
          minimum: 1
    FreeTextSettings:
      type: object
      title: FreeTextSettings
      additionalProperties: false
      properties:
        multiline:
          type: boolean
          default: false
        maxLength:
          type: integer
          minimum: 1
          maximum: 5000
          default: 1000
    Option:
      type: object
      required: [id, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
        sortOrder:
          type: integer

    # ---------- Templates ----------
    SaveAsTemplateRequest:
      type: object
      required: [surveyId]
      properties:
        surveyId:
          type: string
          format: uuid
          description: Kaynak anket (Admin'in kendi anketi)
        name:
          type: string
          maxLength: 200
          description: Boşsa anketin başlığı kullanılır
        description:
          type: string
          maxLength: 2000
          description: Boşsa anketin açıklaması kullanılır
    TemplateSaveRequest:
      type: object
      description: Upsert gövdesi. Yalnızca `name` zorunludur.
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          description: Yoksa yeni şablon oluşturulur; varsa bu şablon güncellenir
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        questions:
          type: array
          maxItems: 200
          description: Şablonun sorularının tamamı; dizi sırası = soru sırası
          items:
            $ref: '#/components/schemas/TemplateQuestionInput'
    TemplateQuestionInput:
      type: object
      description: |
        Anket taslağındaki gibi tüm alanlar boş olabilir. `settings` yalnızca `type` doluyken gönderilir ve
        varsayılanlarla tamamlanır; `options` yalnızca `SINGLE_CHOICE` ve `MULTIPLE_CHOICE` için gönderilir.
      properties:
        text:
          type: string
          maxLength: 1000
        type:
          $ref: '#/components/schemas/QuestionType'
        required:
          type: boolean
          default: false
        settings:
          $ref: '#/components/schemas/QuestionSettings'
        options:
          type: array
          maxItems: 100
          description: Dizi sırası = seçenek sırası
          items:
            type: object
            properties:
              label:
                type: string
                maxLength: 200
    CreateSurveyFromTemplateRequest:
      type: object
      required: [templateId]
      properties:
        templateId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
          description: Boşsa şablonun adı kullanılır
    TemplateSummary:
      type: object
      description: Değeri olmayan (null) alanlar yanıtta yer almaz.
      required: [id, name, questionCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        questionCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TemplateListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
    TemplateDetail:
      allOf:
        - $ref: '#/components/schemas/TemplateSummary'
        - type: object
          required: [questions]
          properties:
            questions:
              type: array
              items:
                $ref: '#/components/schemas/TemplateQuestion'
    TemplateQuestion:
      type: object
      description: Şablon sorusu; kimlik taşımaz. Taslakta `text`, `type` ve `settings` boş olabilir.
      required: [number, required, options]
      properties:
        number:
          type: integer
          description: Şablonda görünen soru numarası (1'den başlar)
        text:
          type: string
          nullable: true
        type:
          allOf:
            - $ref: '#/components/schemas/QuestionType'
          nullable: true
        required:
          type: boolean
        settings:
          allOf:
            - $ref: '#/components/schemas/QuestionSettings'
          nullable: true
          description: Tip seçiliyse varsayılanlarla tamamlanmış ayarlar
        options:
          type: array
          description: Yalnızca `SINGLE_CHOICE` ve `MULTIPLE_CHOICE` için dolu
          items:
            type: object
            required: [sortOrder]
            properties:
              label:
                type: string
                nullable: true
              sortOrder:
                type: integer
                description: 0'dan başlar

    # ---------- Users / Publish ----------
    UserSummary:
      type: object
      description: Ankete davet edilebilecek kullanıcı (`USER` rolünde, aktif)
      required: [id, fullName, email]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
    UserListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
    PublishSurveyRequest:
      type: object
      required: [surveyId, userIds]
      properties:
        surveyId:
          type: string
          format: uuid
        userIds:
          type: array
          minItems: 1
          maxItems: 1000
          description: Davet edilecek katılımcılar; tekrarlananlar tekilleştirilir
          items:
            type: string
            format: uuid
    PublishSurveyResponse:
      type: object
      required: [surveyId, status, publishedAt, invitationCount, invitations]
      properties:
        surveyId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SurveyStatus'
        publishedAt:
          type: string
          format: date-time
        invitationCount:
          type: integer
        invitations:
          type: array
          description: Oluşturulan davetler ve mail durumları. Davet linki yanıtta dönmez; yalnızca maille gider.
          items:
            $ref: '#/components/schemas/InvitationSummary'
      example:
        surveyId: 9a7d3c21-4b8e-4f0a-a1c2-7e5d9b3f2a68
        status: PUBLISHED
        publishedAt: '2026-11-03T12:00:00Z'
        invitationCount: 1
        invitations:
          - userId: 0a1b2c3d-0000-4000-8000-000000000101
            email: zeynep.kaya@definex.com
            fullName: Zeynep Kaya
            emailStatus: QUEUED
    InvitationSummary:
      type: object
      required: [userId, email, fullName, emailStatus]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        emailStatus:
          $ref: '#/components/schemas/EmailStatus'

    # ---------- Mails ----------
    EmailStatus:
      type: string
      description: |
        - `QUEUED` kuyrukta (commit sonrası gönderilecek)
        - `SENDING` gönderiliyor
        - `SENT` gönderildi
        - `FAILED` gönderilemedi (admin yeniden gönderebilir)
      enum: [QUEUED, SENDING, SENT, FAILED]
    InvitationStatus:
      type: string
      description: |
        - `PENDING` davet oluşturuldu, katılımcı henüz giriş yapmadı
        - `STARTED` katılımcı giriş yaptı
        - `COMPLETED` yanıt gönderildi
        - `CANCELLED` iptal edildi
      enum: [PENDING, STARTED, COMPLETED, CANCELLED]
    MailListItem:
      type: object
      required: [emailId, invitationId, surveyId, surveyTitle, recipientEmail, emailStatus, invitationStatus, attemptCount, stuck, resendable]
      properties:
        emailId:
          type: string
          format: uuid
        invitationId:
          type: string
          format: uuid
        surveyId:
          type: string
          format: uuid
        surveyTitle:
          type: string
        recipientName:
          type: string
          nullable: true
        recipientEmail:
          type: string
          format: email
        emailStatus:
          $ref: '#/components/schemas/EmailStatus'
        invitationStatus:
          $ref: '#/components/schemas/InvitationStatus'
        attemptCount:
          type: integer
          description: Gönderim denemesi sayısı (ilk gönderim + yeniden gönderimler)
        lastError:
          type: string
          nullable: true
          description: Son gönderim hatası (kısaltılmış)
        lastAttemptAt:
          type: string
          format: date-time
          nullable: true
        sentAt:
          type: string
          format: date-time
          nullable: true
        stuck:
          type: boolean
          description: 10 dakikadan uzun süredir `SENDING` durumunda (gönderim sırasında uygulama kapanmış olabilir)
        resendable:
          type: boolean
          description: |
            Yeniden gönderilebilir: mail `FAILED` veya takılı ve davet hâlâ geçerli (anket `PUBLISHED`, bitiş tarihi
            gelecekte, davet `COMPLETED`/`CANCELLED` değil). Ön yüz seçim kutusunu buna göre açar.
    MailListResponse:
      type: object
      required: [items, summary, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MailListItem'
        summary:
          type: object
          description: Durum filtreleri uygulanmadan (yalnızca `surveyId` ve `q` ile) mail durumu başına sayılar
          properties:
            QUEUED:
              type: integer
            SENDING:
              type: integer
            SENT:
              type: integer
            FAILED:
              type: integer
        page:
          $ref: '#/components/schemas/PageMeta'
    ResendMailsRequest:
      type: object
      required: [emailIds]
      properties:
        emailIds:
          type: array
          minItems: 1
          maxItems: 100
          description: Tekrarlananlar tekilleştirilir
          items:
            type: string
            format: uuid
    ResendMailsResponse:
      type: object
      required: [requeuedCount, items]
      properties:
        requeuedCount:
          type: integer
        items:
          type: array
          items:
            type: object
            required: [emailId, status]
            properties:
              emailId:
                type: string
                format: uuid
              status:
                $ref: '#/components/schemas/EmailStatus'

    # ---------- Report ----------
    ReportListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportListItem'
        page:
          $ref: '#/components/schemas/PageMeta'
    ReportListItem:
      type: object
      description: Değeri olmayan (null) alanlar yanıtta yer almaz.
      required: [surveyId, title, status, invitationCount, deliveredInvitationCount, responseCount, participationRate]
      properties:
        surveyId:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/SurveyStatus'
        responseMode:
          $ref: '#/components/schemas/ResponseMode'
        endsAt:
          type: string
          format: date-time
        invitationCount:
          type: integer
        deliveredInvitationCount:
          type: integer
          description: Maili başarıyla gönderilen davet sayısı (katılım oranının paydası)
        responseCount:
          type: integer
        participationRate:
          type: number
          format: double
          minimum: 0
          description: yanıt / gönderilen davet × 100, bir ondalık
        lastResponseAt:
          type: string
          format: date-time
          description: Son yanıt zamanı; yanıt yoksa yer almaz
    SurveyReport:
      type: object
      description: Değeri olmayan (null) alanlar yanıtta yer almaz.
      required: [surveyId, title, status, responseMode, generatedAt, summary, questions]
      properties:
        surveyId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/SurveyStatus'
        responseMode:
          $ref: '#/components/schemas/ResponseMode'
        endsAt:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/ReportSummary'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionReport'
        responses:
          type: array
          description: Yalnızca kayıtlı modda (FR-74); anonim modda alan yer almaz (BR-06). En yeni önce.
          items:
            $ref: '#/components/schemas/ParticipantResponse'
    ReportSummary:
      type: object
      description: Özet göstergeler (FR-70)
      required: [invitationCount, deliveredInvitationCount, responseCount, participationRate]
      properties:
        invitationCount:
          type: integer
        deliveredInvitationCount:
          type: integer
          description: Maili başarıyla gönderilen davet sayısı (katılım oranının paydası)
        responseCount:
          type: integer
        participationRate:
          type: number
          format: double
          minimum: 0
        averageSatisfactionScore:
          type: number
          format: double
          description: Tüm Likert cevaplarının 1–5 ölçeğine çevrilmiş ortalaması; Likert cevabı yoksa yer almaz
        averageCompletionSeconds:
          type: integer
          description: Süresi ölçülen (ara kaydı olan) yanıtların ortalaması; yoksa yer almaz
    QuestionReport:
      oneOf:
        - $ref: '#/components/schemas/LikertQuestionReport'
        - $ref: '#/components/schemas/ChoiceQuestionReport'
        - $ref: '#/components/schemas/FreeTextQuestionReport'
      discriminator:
        propertyName: type
        mapping:
          LIKERT: '#/components/schemas/LikertQuestionReport'
          SINGLE_CHOICE: '#/components/schemas/ChoiceQuestionReport'
          MULTIPLE_CHOICE: '#/components/schemas/ChoiceQuestionReport'
          FREE_TEXT: '#/components/schemas/FreeTextQuestionReport'
    QuestionReportBase:
      type: object
      required: [questionId, number, type, answerCount]
      properties:
        questionId:
          type: string
          format: uuid
        number:
          type: integer
        text:
          type: string
        type:
          $ref: '#/components/schemas/QuestionType'
        answerCount:
          type: integer
          description: Soruyu yanıtlayan kişi sayısı (yüzdelerin paydası)
    LikertQuestionReport:
      allOf:
        - $ref: '#/components/schemas/QuestionReportBase'
        - type: object
          required: [scale, distribution]
          properties:
            scale:
              type: integer
            average:
              type: number
              format: double
              description: Sorunun kendi ölçeğinde ortalama; cevap yoksa yer almaz
            distribution:
              type: array
              description: 1..scale her değer için bir satır
              items:
                type: object
                required: [value, count, percentage]
                properties:
                  value:
                    type: integer
                  label:
                    type: string
                    description: Yalnızca uç değerlerde (minLabel / maxLabel)
                  count:
                    type: integer
                  percentage:
                    type: number
                    format: double
    ChoiceQuestionReport:
      allOf:
        - $ref: '#/components/schemas/QuestionReportBase'
        - type: object
          required: [options, otherCount, otherAnswers]
          properties:
            options:
              type: array
              description: Anketteki seçenek sırasıyla; çoklu seçimde yüzdelerin toplamı %100'ü aşabilir
              items:
                type: object
                required: [optionId, count, percentage]
                properties:
                  optionId:
                    type: string
                    format: uuid
                  label:
                    type: string
                  count:
                    type: integer
                  percentage:
                    type: number
                    format: double
            otherCount:
              type: integer
              description: “Diğer” seçen sayısı
            otherAnswers:
              type: array
              description: “Diğer” metinleri, en yeni önce
              items:
                $ref: '#/components/schemas/ReportTextAnswer'
    FreeTextQuestionReport:
      allOf:
        - $ref: '#/components/schemas/QuestionReportBase'
        - type: object
          required: [answers]
          properties:
            answers:
              type: array
              description: Tüm metin cevapları, en yeni önce. Ham metin; istemci düz metin olarak göstermelidir (NFR-05)
              items:
                $ref: '#/components/schemas/ReportTextAnswer'
    ReportTextAnswer:
      type: object
      required: [text, submittedAt]
      properties:
        text:
          type: string
        submittedAt:
          type: string
          format: date-time
          description: Anonim modda saat hassasiyetinde (BR-06)
    ParticipantResponse:
      type: object
      required: [responseId, submittedAt, answers]
      properties:
        responseId:
          type: string
          format: uuid
        participant:
          type: object
          required: [fullName, email]
          properties:
            fullName:
              type: string
            email:
              type: string
              format: email
        submittedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
          description: Yalnızca ara kaydı olan yanıtlarda
        answers:
          type: array
          description: Yalnızca yanıtlanan sorular, soru sırasıyla
          items:
            type: object
            required: [questionId, value]
            properties:
              questionId:
                type: string
                format: uuid
              value:
                type: string
                description: 'Okunur cevap: Likert puanı, seçenek etiketleri (`, ` ile, "Diğer: …" dahil) veya metin'

    # ---------- User Survey ----------
    UserSurvey:
      type: object
      description: Katılımcıya gösterilen anket formu (S-08)
      required: [id, title, responseMode, endsAt, questions, totalQuestionCount]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        responseMode:
          $ref: '#/components/schemas/ResponseMode'
        anonymousNotice:
          type: string
          nullable: true
          description: Anonim modda formun başında gösterilecek bilgilendirme metni (FR-67); kayıtlı modda `null`
          example: Yanıtlarınız anonim olarak toplanmaktadır; kimliğinizle ilişkilendirilmez.
        endsAt:
          type: string
          format: date-time
        totalQuestionCount:
          type: integer
          description: İlerleme çubuğu için toplam soru sayısı (FR-61)
        questions:
          type: array
          description: Sorular görüntüleme sırasıyla
          items:
            $ref: '#/components/schemas/UserQuestion'
        draft:
          allOf:
            - $ref: '#/components/schemas/UserDraft'
          nullable: true
          description: Ara kayıt (draft uçlarıyla birlikte dolacak; şimdilik null)
    UserQuestion:
      type: object
      required: [id, number, text, type, required, settings]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        text:
          type: string
        type:
          $ref: '#/components/schemas/QuestionType'
        required:
          type: boolean
          description: '`true` ise formda “*” ile gösterilir (FR-25)'
        settings:
          $ref: '#/components/schemas/QuestionSettings'
        options:
          type: array
          items:
            $ref: '#/components/schemas/UserOption'
    UserOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
    UserDraft:
      type: object
      required: [answers, savedAt]
      properties:
        currentQuestionId:
          type: string
          format: uuid
          nullable: true
          description: Katılımcının kaldığı soru
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerInput'
        savedAt:
          type: string
          format: date-time
    AnswerInput:
      type: object
      required: [questionId]
      description: |
        Soru tipine göre tek bir değer alanı doldurulur:
        | Tip | Alan |
        |---|---|
        | `LIKERT` | `numericValue` (1..scale) |
        | `SINGLE_CHOICE` | `optionIds` (tek eleman) ve/veya `otherText` |
        | `MULTIPLE_CHOICE` | `optionIds` (minSelect..maxSelect) ve/veya `otherText` |
        | `FREE_TEXT` | `text` (≤ maxLength) |
      properties:
        questionId:
          type: string
          format: uuid
        numericValue:
          type: integer
          description: Likert değeri (1..scale)
        optionIds:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        otherText:
          type: string
          maxLength: 500
          description: “Diğer” seçeneği için serbest metin
        text:
          type: string
          maxLength: 5000
    UserDraftRequest:
      type: object
      required: [answers]
      properties:
        currentQuestionId:
          type: string
          format: uuid
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerInput'
    UserDraftResponse:
      type: object
      required: [savedAt, answeredCount, totalQuestionCount]
      properties:
        savedAt:
          type: string
          format: date-time
        answeredCount:
          type: integer
        totalQuestionCount:
          type: integer
    UserSubmitRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerInput'
    UserSubmitResponse:
      type: object
      description: Teşekkür ekranı (S-09) için
      required: [submittedAt, message]
      properties:
        submittedAt:
          type: string
          format: date-time
        message:
          type: string
          example: Cevaplarınız başarıyla gönderildi. Katılımınız için teşekkür ederiz.
