openapi: 3.0.3
info:
  title: Survey Tool API v1
  version: 1.0.0
  description: |
    Survey Tool MVP API sözleşmesi (Kaynak: Survey_Tool_Analiz_v1.0).

    API iki ayrı kullanıcı grubuna ayrılmıştır:

    | Grup | Yol öneki | Kimlik | Token |
    |---|---|---|---|
    | **Admin** (anket sahibi) | `/admin` | E-posta + şifre | `adminAuth`: kullanıcıya bağlı JWT |
    | **User** (katılımcı) | `/user` | E-postadaki davet tokenı | `userAuth`: tek bir davete ve ankete bağlı JWT |

    İki token birbirinin uçlarında geçersizdir. Admin token'ı `/user/*`, user token'ı `/admin/*` uçlarında `401` döner.

    **Katılımcı akışı**
    1. Katılımcı e-postadaki kişiye özel linke tıklar (`https://{host}/s/{invitationToken}`).
    2. Ön yüz linkteki davet tokenını `POST /user/auth/login` ile kısa ömürlü bir oturum token'ına çevirir.
       Davet tokenı yalnızca bu uçta kullanılır, diğer isteklerde dolaşmaz.
    3. `GET /user/surveys/{surveyId}` formu ve varsa ara kayıtları getirir (kaldığı yerden devam).
    4. Sayfa geçişlerinde `PUT /user/surveys/{surveyId}/draft` ile ara kayıt yapılır.
    5. `POST /user/surveys/{surveyId}/submit` yanıtı kesinleştirir. Davet tokenı **bu anda** tüketilir (BR-02) ve
       oturum kapanır. Aynı linkle tekrar girişte `ALREADY_RESPONDED` döner.

    **Genel kurallar**
    - Tüm zaman alanları ISO-8601 UTC (`2026-11-30T21:00:00Z`) taşınır; ekranda Europe/Istanbul gösterilir (FR-50).
    - Hatalar `application/problem+json` (RFC 7807) formatındadır; makine tarafından okunacak alan `code`'dur.
    - Admin yalnızca kendi anketlerine erişir (BR-09). Başkasına ait anket için `404` döner (varlık sızdırılmaz).
    - Anket yapısı bölümsüzdür: anket → sorular → seçenekler. Anket oluşturma ve güncelleme tek uçtan yapılır
      (`POST /admin/upsertSurvey`); eşzamanlı düzenlemede son kaydeden kazanır.

    **Versiyonlama**
    - Major sürüm URL'de taşınır: `/api/v1`. Bu doküman v1 sözleşmesidir.
    - v1 içinde yalnızca geriye uyumlu değişiklik yapılır (yeni uç, opsiyonel alan, yeni enum değeri); `info.version` minor/patch artar (1.1.0, 1.0.1).
    - Geriye uyumsuz değişiklik (alan silme/yeniden adlandırma, zorunlu alan ekleme, davranış değişikliği) yeni major sürümle `/api/v2` olarak yayınlanır.
    - İstemciler bilinmeyen alanları ve enum değerlerini yok saymalıdır.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: survey.example.com
tags:
  - name: Admin - Auth
    description: Admin kimlik doğrulama
  - name: Admin - Surveys
    description: Anket yönetimi ve yaşam döngüsü
  - name: Admin - Users
    description: Ankete davet edilecek kullanıcılar
  - name: Admin - Reports
    description: Anket raporu ve dışa aktarım
  - name: User - Auth
    description: Katılımcının davet tokenı ile oturum açması
  - name: User - Surveys
    description: Katılımcı anket formu, ara kayıt ve gönderim

paths:
  # =====================================================================
  # ADMIN
  # =====================================================================
  /admin/auth/login:
    post:
      tags: [Admin - Auth]
      operationId: adminLogin
      summary: Admin girişi
      description: |
        E-posta ve şifre ile giriş yapar; access ve refresh token döner.
        Hatalı girişte kullanıcının var olup olmadığı belli edilmez (genel hata mesajı).
        Yalnızca `ADMIN` rolündeki aktif kullanıcılar giriş yapabilir; `USER` rolü de aynı genel hatayı alır.
        Kilit (FR-01):
        - Aynı e-posta + IP'den 5 hatalı denemede o IP 15 dakika kilitlenir (`423`).
        - Bir e-postaya tüm IP'lerden 15 dakika içinde toplam 20 hatalı deneme gelirse e-posta kilitlenir.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
            example:
              email: ayse.yilmaz@definex.com
              password: '********'
      responses:
        '200':
          description: Giriş başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: E-posta veya şifre hatalı
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://survey.example.com/problems/invalid-credentials
                title: E-posta veya şifre hatalı
                status: 401
                code: INVALID_CREDENTIALS
        '423':
          description: Hesap çok sayıda hatalı deneme nedeniyle geçici olarak kilitli
          headers:
            Retry-After:
              description: Kilidin açılmasına kalan saniye
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://survey.example.com/problems/account-locked
                title: Hesap geçici olarak kilitlendi
                status: 423
                code: ACCOUNT_LOCKED
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/auth/refresh:
    post:
      tags: [Admin - Auth]
      operationId: adminRefreshToken
      summary: Admin oturumunu yenile
      description: |
        Geçerli refresh token karşılığında yeni bir token çifti döner. Refresh token tek kullanımlıktır (rotation);
        kullanılmış bir token tekrar gelirse ilgili oturum zinciri iptal edilir.
        Son refresh'ten bu yana 30 dakika geçtiyse (FR-02) veya oturum 7 günlük mutlak ömrünü doldurduysa `401` döner.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Yeni token çifti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAuthTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/SessionExpired'

  /admin/auth/logout:
    post:
      tags: [Admin - Auth]
      operationId: adminLogout
      summary: Admin çıkışı
      description: |
        Access token'daki `sid` ile bağlı olduğu oturumu ve o oturumun refresh token'ını iptal eder.
        Gövde almaz. İdempotenttir; oturum zaten kapalıysa da `204` döner.
        Access token kalan ömrü boyunca (en fazla 15 dk) geçerli kalır; istemci token'ları silmelidir.
      security:
        - adminAuth: []
      responses:
        '204':
          description: Oturum sonlandırıldı
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/surveys:
    get:
      tags: [Admin - Surveys]
      operationId: adminListSurveys
      summary: Anketleri listele
      description: Admin'in sahip olduğu anketleri sayfalı döner; başlıkta arama, duruma göre filtre, sıralama (FR-10).
      security:
        - adminAuth: []
      parameters:
        - name: q
          in: query
          description: Anket başlığında arama (büyük/küçük harf duyarsız)
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          description: Duruma göre filtre; birden çok verilebilir. Verilmezse `ARCHIVED` hariç tümü döner.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SurveyStatus'
        - name: sort
          in: query
          description: Sıralama alanı; `-` öneki azalan sıralama.
          schema:
            type: string
            enum: [title, -title, endsAt, -endsAt, createdAt, -createdAt, updatedAt, -updatedAt]
            default: -updatedAt
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Anket listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/upsertSurvey:
    post:
      tags: [Admin - Surveys]
      operationId: adminUpsertSurvey
      summary: Anketi kaydet (upsert: oluştur / güncelle)
      description: |
        Anket ekranındaki "Kaydet" (upsert). "Yeni anket" ekranını ön yüz hazırlar; ilk kaydetmede anket oluşur,
        sonraki kaydetmelerde aynı uç güncelleme yapar.

        **Oluşturma / güncelleme**
        - Gövdede `id` yoksa yeni anket `DRAFT` durumunda oluşturulur → `201` + `Location`.
        - `id` varsa anket güncellenir → `200`. Anket yoksa veya başka bir admin'e aitse `404`.
        - Yanıt anketin güncel hâlidir; yeni oluşan soru ve seçeneklerin id'leri yanıtta döner. Ön yüz sonraki
          kaydetmede bu id'leri geri gönderir.

        **Sorular ve seçenekler** (`questions`, `options`)
        - `id`'li olan güncellenir, `id`'siz olan eklenir, listede olmayan **silinir**.
        - Dizi sırası = görüntüleme sırası. Soru numarası (`number`) buna göre hesaplanır.
        - `questions` gönderilmezse veya boşsa anketin tüm soruları silinir.

        **Taslak kaydı**: Yalnızca `title` zorunludur. Diğer alanlar boş olabilir; dolu gelirlerse biçimleri kontrol
        edilir. Tamlık (bitiş tarihi, en az bir soru, seçimli sorularda en az iki seçenek vb.) yayınlamada kontrol edilir.

        **Duruma göre izinler**
        | Durum | İzin verilen |
        |---|---|
        | `DRAFT` | Tüm alanlar |
        | `PUBLISHED` | Yalnızca metinler: `title`, `description`, soru `text`, seçenek `label`. Soru/seçenek ekleme, silme, sıra, `type`, `required`, `settings`, `endsAt`, `responseMode` değişirse `409 SURVEY_STRUCTURE_LOCKED` (BR-04, BR-05). Değişmeyen alanlar da gönderilmelidir. |
        | `EXPIRED`, `CLOSED`, `ARCHIVED` | Kaydedilemez → `409 SURVEY_NOT_EDITABLE` |

        Eşzamanlı düzenlemede son kaydeden kazanır.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveySaveRequest'
            examples:
              firstSave:
                summary: İlk kayıt (id yok, yarım anket)
                value:
                  title: 2026 Q4 Çalışan Memnuniyeti
                  description: Çeyrek sonu memnuniyet anketi
                  responseMode: ANONYMOUS
                  questions:
                    - text: Şirketimizde çalışmaktan memnunum.
                      type: LIKERT
                      required: true
                    - text: Hangi yan hakları kullanıyorsunuz?
                      type: MULTIPLE_CHOICE
                      settings:
                        maxSelect: 3
                      options:
                        - label: Özel sağlık sigortası
                    - type: FREE_TEXT
              nextSave:
                summary: Sonraki kayıt (id'ler geri gönderilir)
                value:
                  id: 9a7d3c21-4b8e-4f0a-a1c2-7e5d9b3f2a68
                  title: 2026 Q4 Çalışan Memnuniyeti
                  description: Çeyrek sonu memnuniyet anketi
                  responseMode: ANONYMOUS
                  endsAt: '2026-11-30T21:00:00Z'
                  questions:
                    - id: 3e6b9d85-1a3f-4c9e-8d1b-6c5a4f0e8d43
                      text: Eklemek istedikleriniz?
                      type: FREE_TEXT
                      settings:
                        multiline: true
                        maxLength: 1000
                    - id: 2d5a8c74-0f2e-4b8d-9c0a-5b4f3e9d7c32
                      text: Hangi yan hakları kullanıyorsunuz?
                      type: MULTIPLE_CHOICE
                      settings:
                        maxSelect: 3
                      options:
                        - id: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                          label: Özel sağlık sigortası
                        - label: Yemek kartı
      responses:
        '200':
          description: Anket güncellendi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyDetail'
        '201':
          description: Anket oluşturuldu
          headers:
            Location:
              description: Oluşturulan anketin adresi
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `SURVEY_STRUCTURE_LOCKED`: yayındaki ankette metin dışı değişiklik.
            `SURVEY_NOT_EDITABLE`: anket bu durumda düzenlenemez.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://survey.example.com/problems/survey-structure-locked
                title: Yayındaki ankette yalnızca metinler değiştirilebilir
                status: 409
                code: SURVEY_STRUCTURE_LOCKED
        '422':
          description: |
            `INVALID_STRUCTURE`: aynı id iki kez gönderildi, soru/seçenek id'si bu ankete (soruya) ait değil veya
            seçimli olmayan tipe seçenek gönderildi. Hatalı alanlar `errors[].field` ile döner.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://survey.example.com/problems/invalid-structure
                title: Anket yapısı geçersiz
                status: 422
                code: INVALID_STRUCTURE
                errors:
                  - field: questions[1].id
                    code: UNKNOWN_ID
                    message: Bu soru bu ankete ait değil

  /admin/surveys/{surveyId}:
    parameters:
      - $ref: '#/components/parameters/SurveyId'
    get:
      tags: [Admin - Surveys]
      operationId: adminGetSurvey
      summary: Anketi getir
      description: Anketi soruları ve seçenekleriyle döner. `allowedActions` ekranda hangi aksiyonların aktif olacağını belirler (FR-11).
      security:
        - adminAuth: []
      responses:
        '200':
          description: Anket detayı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin - Surveys]
      operationId: adminDeleteSurvey
      summary: Anketi sil
      description: |
        Anketi soruları ve seçenekleriyle kalıcı olarak siler. Yalnızca `DRAFT` anket silinebilir; yayınlanmış ankete
        yanıt gelmiş olabilir (BR-08). Yanıt modülü eklendiğinde kural "yanıtı yoksa silinebilir" olarak gevşetilecek.
      security:
        - adminAuth: []
      responses:
        '204':
          description: Anket silindi
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Anket taslak değil
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://survey.example.com/problems/survey-not-deletable
                title: Yalnızca taslak anketler silinebilir
                status: 409
                code: SURVEY_NOT_DELETABLE

  /admin/getAllUsers:
    get:
      tags: [Admin - Users]
      operationId: adminGetAllUsers
      summary: Davet edilebilecek kullanıcıları listele
      description: |
        Anket düzenleme ekranında katılımcı seçimi için kullanılır. Yalnızca `USER` rolündeki aktif kullanıcılar
        döner; ada göre artan sıralıdır. Ayrı bir katılımcı tablosu yoktur; katılımcılar `users` tablosundadır.
      security:
        - adminAuth: []
      parameters:
        - name: q
          in: query
          description: Ad veya e-postada arama (büyük/küçük harf duyarsız)
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Kullanıcı listesi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/publishSurvey:
    post:
      tags: [Admin - Surveys]
      operationId: adminPublishSurvey
      summary: Anketi yayınla
      description: |
        "Gönder" aksiyonu (FR-42). Seçilen katılımcılar (`GET /admin/getAllUsers`) için davet oluşturur ve anketi
        `DRAFT` → `PUBLISHED` yapar.

        **Kontroller (sırayla)**
        1. Anket yoksa veya başka bir admin'e aitse `404`.
        2. Anket `DRAFT` değilse `409 INVALID_SURVEY_STATUS`. Tekrar gönderim de bu hatayı alır; idempotency anahtarı gerekmez.
        3. Tamlık kuralları sağlanmıyorsa `422 SURVEY_INCOMPLETE`; tüm eksikler tek seferde `errors[]` içinde döner:

           | `code` | `field` | Kural |
           |---|---|---|
           | `END_DATE_REQUIRED` / `END_DATE_IN_PAST` | `endsAt` | dolu ve gelecekte (FR-20) |
           | `RESPONSE_MODE_REQUIRED` | `responseMode` | dolu |
           | `SURVEY_HAS_NO_QUESTIONS` | `questions` | en az 1 soru |
           | `TEXT_REQUIRED` / `TYPE_REQUIRED` | `questions[i].text` / `.type` | dolu |
           | `MIN_TWO_OPTIONS` | `questions[i].options` | seçimli soruda etiketi dolu en az 2 seçenek (FR-22) |
           | `LABEL_REQUIRED` | `questions[i].options[j].label` | dolu |
           | `MAX_SELECT_EXCEEDS_OPTIONS` | `questions[i].settings.maxSelect` | seçenek sayısını aşamaz |
        4. `userIds` içinde bulunamayan, `USER` rolünde olmayan veya pasif kullanıcı varsa `422 INVALID_PARTICIPANTS`
           (`errors[].field` = `userIds[i]`). Tekrarlanan id'ler tekilleştirilir.

        **Davetler**
        - Her katılımcı için davete özel, 256 bit bir token üretilir; yalnızca SHA-256 hash'i saklanır (NFR-02).
        - Link: `{FRONTEND_BASE_URL}/s/{token}`. İlk adımda katılımcı şifre girmez; link tek başına anket erişimi sağlar.
        - Davet geçerliliği anketin `endsAt` değerinden türetilir. Yanıt gönderildikten sonra link kullanılamaz.
        - E-posta henüz gönderilmez. Linkler yanıttaki `invitations` alanında döner (geçici; mail altyapısı
          eklendiğinde kaldırılacak) ve dev profilinde log'a yazılır.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishSurveyRequest'
            example:
              surveyId: 9a7d3c21-4b8e-4f0a-a1c2-7e5d9b3f2a68
              userIds:
                - 0a1b2c3d-0000-4000-8000-000000000101
                - 0a1b2c3d-0000-4000-8000-000000000102
      responses:
        '200':
          description: Anket yayınlandı, davetler oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishSurveyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Anket taslak değil
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://survey.example.com/problems/invalid-survey-status
                title: Yalnızca taslak anket yayınlanabilir
                status: 409
                code: INVALID_SURVEY_STATUS
        '422':
          description: '`SURVEY_INCOMPLETE` veya `INVALID_PARTICIPANTS`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://survey.example.com/problems/survey-incomplete
                title: Anket yayınlanmaya hazır değil
                status: 422
                code: SURVEY_INCOMPLETE
                errors:
                  - field: endsAt
                    code: END_DATE_REQUIRED
                    message: Bitiş tarihi girilmelidir
                  - field: questions[0].options
                    code: MIN_TWO_OPTIONS
                    message: En az iki seçenek girilmelidir

  /admin/surveys/{surveyId}/report:
    parameters:
      - $ref: '#/components/parameters/SurveyId'
    get:
      tags: [Admin - Reports]
      operationId: adminGetSurveyReport
      summary: Anket raporu
      description: |
        Özet göstergeler ve soru bazlı yanıt dağılımlarını döner (FR-70, FR-71). Göstergeler anlık verilerle hesaplanır.
        - Yalnızca gönderilmiş (tamamlanmış) yanıtlar dahil edilir; ara kayıtlar hariçtir (BR-03).
        - Katılım oranı = tamamlanan yanıt / başarıyla gönderilen davet × 100 (BR-10).
        - Yanıt sayısı anonimlik eşiğinin (varsayılan 5) altındaysa soru bazlı dağılımlar gösterilmez,
          `anonymityThresholdMet=false` döner (BR-07).
        - `DRAFT` durumundaki anket için rapor yoktur (`409`).
      security:
        - adminAuth: []
      parameters:
        - name: textAnswerLimit
          in: query
          description: Serbest metin sorularında dönecek en yeni yanıt sayısı
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 20
      responses:
        '200':
          description: Anket raporu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Anket henüz yayınlanmadı
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://survey.example.com/problems/report-not-available
                title: Taslak anket için rapor oluşturulamaz
                status: 409
                code: REPORT_NOT_AVAILABLE

  /admin/surveys/{surveyId}/report/download:
    parameters:
      - $ref: '#/components/parameters/SurveyId'
    post:
      tags: [Admin - Reports]
      operationId: adminDownloadSurveyReport
      summary: Raporu indir (CSV / PDF)
      description: |
        Raporu dosya olarak üretir (FR-73).
        - **CSV**: Her yanıt bir satır, her soru bir sütun; UTF-8 BOM ile (Türkçe karakterler korunur).
          Kayıtlı modda katılımcı e-postası ilk sütundur; anonim modda kimlik sütunu yoktur.
        - **PDF**: Rapor ekranındaki özet göstergeler ve dağılım grafikleri.

        10.000 yanıta kadar dosya senkron olarak `200` ile döner (NFR-13). Daha büyük veri setlerinde
        `202` döner; dosya arka planda hazırlanır ve hazır olduğunda Admin'e indirme linki e-postayla iletilir.
        Her indirme denetim kaydına yazılır (NFR-07).
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDownloadRequest'
            example:
              format: CSV
      responses:
        '200':
          description: Rapor dosyası
          headers:
            Content-Disposition:
              description: Dosya adı, ör. `attachment; filename="2026-q4-calisan-memnuniyeti.csv"`
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '202':
          description: Dosya arka planda hazırlanıyor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobAccepted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Anket henüz yayınlanmadı veya anonimlik eşiği altında
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # =====================================================================
  # USER (KATILIMCI)
  # =====================================================================
  /user/auth/login:
    post:
      tags: [User - Auth]
      operationId: userLogin
      summary: Katılımcı girişi (davet tokenı ile)
      description: |
        E-postadaki kişiye özel linkte yer alan davet tokenını, tek bir davete ve ankete bağlı kısa ömürlü
        bir oturum token'ına çevirir (FR-60). Katılımcı hesap açmaz, şifre girmez.

        - Sunucu davet tokenının hash'ini arar (NFR-02). Bulunamazsa ya da davet iptal edildiyse `401`.
        - Anket `EXPIRED` veya `CLOSED` ise `410`; yanıt zaten gönderildiyse `409` döner (FR-64, FR-65).
        - Davet ilk kez açılıyorsa durumu `SENT` → `STARTED` olur. Davet tokenı burada **tüketilmez**;
          katılımcı gönderime kadar aynı linkle tekrar girebilir (BR-02).
        - Kaba kuvvet denemelerine karşı IP bazlı oran sınırlaması uygulanır (NFR-03).

        Hata yanıtlarında `contactInfo` alanı anket sahibinin iletişim bilgisini taşır (S-10).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
            example:
              invitationToken: 'q7Zx0bR3kN9vYpL2mT6sWc1eHfJ4uAaD8gKiOn5rXyQ'
      responses:
        '200':
          description: Oturum açıldı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAuthTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Davet linki geçersiz veya iptal edilmiş
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UserAccessProblem'
              example:
                type: https://survey.example.com/problems/invalid-invitation
                title: Bu davet linki geçersiz
                status: 401
                code: INVALID_INVITATION
        '409':
          $ref: '#/components/responses/AlreadyResponded'
        '410':
          $ref: '#/components/responses/SurveyNotAvailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /user/auth/refresh:
    post:
      tags: [User - Auth]
      operationId: userRefreshToken
      summary: Katılımcı oturumunu yenile
      description: |
        Katılımcı formu uzun süre açık kaldığında oturumu yeniler. Refresh token tek kullanımlıktır (rotation).
        Anket süresi dolduysa (`410`), yanıt gönderildiyse (`409`) veya davet iptal edildiyse (`401`) yenileme yapılmaz.
        Refresh token da süresi dolmuşsa katılımcı aynı davet linkiyle tekrar giriş yapabilir.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Yeni token çifti
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAuthTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/SessionExpired'
        '409':
          $ref: '#/components/responses/AlreadyResponded'
        '410':
          $ref: '#/components/responses/SurveyNotAvailable'

  /user/surveys/{surveyId}:
    parameters:
      - $ref: '#/components/parameters/SurveyId'
    get:
      tags: [User - Surveys]
      operationId: userGetSurvey
      summary: Anket formu (Katılımcı)
      description: |
        Katılımcının dolduracağı formu döner (FR-60, FR-61). Admin'e özel alanlar (katılımcı sayısı, aksiyonlar,
        sürüm vb.) yer almaz.
        - `draft` alanı varsa katılımcı kaldığı yerden devam eder (FR-63, AS-02).
        - Anonim modda `anonymousNotice` formun başında gösterilir (FR-67).
        - `surveyId` oturum token'ının bağlı olduğu anketle eşleşmezse `404` döner.
      security:
        - userAuth: []
      responses:
        '200':
          description: Anket formu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSurvey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyResponded'
        '410':
          $ref: '#/components/responses/SurveyNotAvailable'

  /user/surveys/{surveyId}/draft:
    parameters:
      - $ref: '#/components/parameters/SurveyId'
    put:
      tags: [User - Surveys]
      operationId: userSaveDraft
      summary: Ara kayıt
      description: |
        Katılımcının o ana kadarki yanıtlarını ara kayıt olarak saklar; her sayfa geçişinde çağrılır (FR-63).
        Gönderilen `answers` mevcut taslağın **tamamını** değiştirir. Zorunlu soru kontrolü burada yapılmaz,
        yalnızca değerlerin soru tipine uygunluğu kontrol edilir. Ara kayıtlar rapora dahil edilmez (BR-03).
      security:
        - userAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDraftRequest'
            example:
              currentQuestionId: 1c4f7b63-9e1d-4a7c-8b9f-4a3e2d8c6b21
              answers:
                - questionId: 1c4f7b63-9e1d-4a7c-8b9f-4a3e2d8c6b21
                  numericValue: 4
      responses:
        '200':
          description: Ara kayıt saklandı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDraftResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyResponded'
        '410':
          $ref: '#/components/responses/SurveyNotAvailable'

  /user/surveys/{surveyId}/submit:
    parameters:
      - $ref: '#/components/parameters/SurveyId'
    post:
      tags: [User - Surveys]
      operationId: userSubmitSurvey
      summary: Anketi gönder
      description: |
        Yanıtı kesinleştirir (FR-64).
        - `answers` nihai yanıtların **tamamıdır**; ara kayıtla birleştirilmez.
        - Zorunlu sorular yanıtlanmadıysa `422` döner; `errors[].field` eksik sorunun `questionId`'sini taşır (FR-62).
        - Başarılı gönderimde davet `COMPLETED` olur, davet tokenı tüketilir ve oturum token'ları iptal edilir (BR-01, BR-02).
        - Anonim modda yanıt ile davet arasında ilişki tutulmaz; ara kayıt silinir (BR-06).
        - Bitiş tarihi geçtiyse yanıt alınmaz (`410`, BR-03).
        - Ağ kopması gibi durumlarda aynı `Idempotency-Key` ile tekrar gönderim aynı sonucu döner, ikinci yanıt oluşmaz.
      security:
        - userAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSubmitRequest'
            example:
              answers:
                - questionId: 1c4f7b63-9e1d-4a7c-8b9f-4a3e2d8c6b21
                  numericValue: 4
                - questionId: 2d5a8c74-0f2e-4b8d-9c0a-5b4f3e9d7c32
                  optionIds:
                    - 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    - 8b2c3d4e-5f6a-4b7c-9d8e-0f1a2b3c4d5e
                - questionId: 3e6b9d85-1a3f-4c9e-8d1b-6c5a4f0e8d43
                  text: Eğitim bütçesinin artırılmasını öneriyorum.
      responses:
        '200':
          description: Yanıt alındı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSubmitResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyResponded'
        '410':
          $ref: '#/components/responses/SurveyNotAvailable'
        '422':
          description: Zorunlu sorular eksik veya yanıt değeri kurallara uymuyor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://survey.example.com/problems/required-answers-missing
                title: Lütfen zorunlu soruları yanıtlayın
                status: 422
                code: REQUIRED_ANSWERS_MISSING
                errors:
                  - field: 4f7c0e96-2b4a-4d0f-9e2c-7d6b5a1f9e54
                    code: REQUIRED
                    message: Bu soru zorunludur

components:
  securitySchemes:
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '`/admin/auth/login` ile alınan, Admin kullanıcısına bağlı token'
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `/user/auth/login` ile alınan katılımcı token'ı. Kişisel veri taşımaz; yalnızca davete ve ankete bağlıdır
        (`sub` = davet kimliği, `sid` = anket kimliği, `aud` = `survey-user`). Yalnızca `/user/*` uçlarında geçerlidir.

  parameters:
    SurveyId:
      name: surveyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Sayfa numarası (1'den başlar)
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      description: Sayfa başına kayıt
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: İstemcinin ürettiği benzersiz anahtar (UUID önerilir); 24 saat saklanır
      schema:
        type: string
        maxLength: 64

  responses:
    ValidationError:
      description: İstek formatı veya alan doğrulaması hatalı
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://survey.example.com/problems/validation-error
            title: İstek doğrulanamadı
            status: 400
            code: VALIDATION_ERROR
            errors:
              - field: title
                code: REQUIRED
                message: Başlık zorunludur
    Unauthorized:
      description: Token yok, süresi dolmuş veya bu uç grubu için geçersiz (admin/user)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://survey.example.com/problems/unauthorized
            title: Oturum geçersiz
            status: 401
            code: UNAUTHORIZED
    SessionExpired:
      description: Refresh token geçersiz, süresi dolmuş, iptal edilmiş veya oturum hareketsizlikten sonlanmış
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://survey.example.com/problems/session-expired
            title: Oturum sona erdi
            status: 401
            code: SESSION_EXPIRED
    NotFound:
      description: Anket bulunamadı veya erişim yetkisi yok
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://survey.example.com/problems/not-found
            title: Anket bulunamadı
            status: 404
            code: SURVEY_NOT_FOUND
    TooManyRequests:
      description: Çok fazla istek
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AlreadyResponded:
      description: Katılımcı bu anketi zaten yanıtladı (AS-01)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UserAccessProblem'
          example:
            type: https://survey.example.com/problems/already-responded
            title: Bu anketi zaten yanıtladınız
            status: 409
            code: ALREADY_RESPONDED
            surveyTitle: 2026 Q4 Çalışan Memnuniyeti
    SurveyNotAvailable:
      description: |
        Anket artık yanıt kabul etmiyor (AS-03).
        `code`: `SURVEY_EXPIRED` (bitiş tarihi geçti) veya `SURVEY_CLOSED` (Admin kapattı)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UserAccessProblem'
          example:
            type: https://survey.example.com/problems/survey-expired
            title: Bu anketin süresi dolmuştur
            status: 410
            code: SURVEY_EXPIRED
            surveyTitle: 2026 Q4 Çalışan Memnuniyeti
            contactInfo: people@definex.com

  schemas:
    # ---------- Ortak ----------
    Problem:
      type: object
      description: RFC 7807 hata gövdesi
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          description: Kullanıcıya gösterilebilir kısa açıklama
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Makine tarafından okunacak hata kodu
          example: VALIDATION_ERROR
        traceId:
          type: string
          description: Log korelasyonu için istek kimliği
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    UserAccessProblem:
      description: Katılımcı erişim hatası; S-10 hata sayfasını beslemek için ek alanlar taşır (FR-65)
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            surveyTitle:
              type: string
              nullable: true
              description: Token geçersizse boş
            contactInfo:
              type: string
              nullable: true
              description: Anket sahibinin iletişim bilgisi
    FieldError:
      type: object
      required: [code, message]
      properties:
        field:
          type: string
          description: Hatanın oluştuğu alan yolu, ör. `questions[2].options[0].id` veya soru kimliği
        code:
          type: string
        message:
          type: string
    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    TokenPair:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Access token ömrü (saniye)
          example: 900
        refreshToken:
          type: string
        refreshExpiresIn:
          type: integer
          description: |
            Refresh token'ın kalan geçerliliği (saniye): hareketsizlik penceresi (30 dk) ile oturumun 7 günlük
            mutlak ömründen kısa olanı. Her refresh'te baştan başlar.
          example: 1800

    # ---------- Admin Auth ----------
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
    AdminAuthTokenResponse:
      description: Admin refresh token ömrü hareketsizlik süresine (30 dk) eşittir ve her yenilemede baştan başlar (FR-02)
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/AdminUser'
    AdminUser:
      type: object
      required: [id, fullName, email, role]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN]

    # ---------- User Auth ----------
    UserLoginRequest:
      type: object
      required: [invitationToken]
      properties:
        invitationToken:
          type: string
          minLength: 22
          maxLength: 256
          description: E-postadaki kişiye özel linkte yer alan davet tokenı (≥128 bit rastgele)
    UserAuthTokenResponse:
      description: Refresh token en geç anketin bitiş tarihine kadar geçerlidir
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [surveyId, invitationStatus]
          properties:
            surveyId:
              type: string
              format: uuid
              description: Ön yüzün `GET /user/surveys/{surveyId}` çağrısı için kullanacağı anket kimliği
            invitationStatus:
              type: string
              enum: [STARTED]
              description: Girişten sonra davet durumu

    # ---------- Admin Survey ----------
    SurveyStatus:
      type: string
      description: |
        - `DRAFT` Taslak
        - `PUBLISHED` Yayında
        - `EXPIRED` Süresi Doldu
        - `CLOSED` Kapandı
        - `ARCHIVED` Arşivlendi
      enum: [DRAFT, PUBLISHED, EXPIRED, CLOSED, ARCHIVED]
    ResponseMode:
      type: string
      description: Yayınlandıktan sonra değiştirilemez (BR-05)
      enum: [ANONYMOUS, IDENTIFIED]
    SurveyAction:
      type: string
      description: |
        Mevcut durumda Admin'in yapabileceği aksiyonlar (FR-11). Yalnızca uygulanmış uçların aksiyonları döner;
        diğerleri uçlar eklendikçe gelecek. `DRAFT`: EDIT, PUBLISH, DELETE · `PUBLISHED`: EDIT · diğer: boş.
      enum: [EDIT, PUBLISH, DELETE]

    SurveySummary:
      type: object
      required: [id, title, status, questionCount, participantCount, allowedActions, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/SurveyStatus'
        responseMode:
          allOf:
            - $ref: '#/components/schemas/ResponseMode'
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        questionCount:
          type: integer
        participantCount:
          type: integer
          description: Davet edilen katılımcı sayısı
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyAction'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SurveyListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SurveySummary'
        page:
          $ref: '#/components/schemas/PageMeta'

    SurveyDetail:
      type: object
      description: Değeri olmayan (null) alanlar yanıtta yer almaz.
      required: [id, title, status, participantCount, allowedActions, createdAt, updatedAt, questions]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/SurveyStatus'
        responseMode:
          allOf:
            - $ref: '#/components/schemas/ResponseMode'
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        participantCount:
          type: integer
          description: Davet edilen katılımcı sayısı
        allowedActions:
          type: array
          items:
            $ref: '#/components/schemas/SurveyAction'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'

    SurveySaveRequest:
      type: object
      description: Upsert gövdesi. Yalnızca `title` zorunludur; diğer alanlar taslakta boş olabilir.
      required: [title]
      properties:
        id:
          type: string
          format: uuid
          description: Yoksa yeni anket oluşturulur; varsa bu anket güncellenir
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        endsAt:
          type: string
          format: date-time
          description: Yayınlamada zorunlu ve gelecekte olmalı (FR-20)
        responseMode:
          $ref: '#/components/schemas/ResponseMode'
        questions:
          type: array
          maxItems: 200
          description: Dizi sırası = soru sırası; listede olmayan mevcut sorular silinir
          items:
            $ref: '#/components/schemas/QuestionSaveInput'
    QuestionSaveInput:
      type: object
      description: |
        Taslakta tüm alanlar boş olabilir.
        - `settings` yalnızca `type` doluyken gönderilir; tipe uymayan veya bilinmeyen alan `400` döner.
          Eksik ayarlar varsayılanlarla doldurulur.
        - `options` yalnızca `SINGLE_CHOICE` ve `MULTIPLE_CHOICE` için gönderilir (aksi `422 INVALID_STRUCTURE`).
          Tip seçimliden başka bir tipe değişirse seçenekler silinir.
      properties:
        id:
          type: string
          format: uuid
          description: Mevcut soru için verilir; yeni soruda boş bırakılır
        text:
          type: string
          maxLength: 1000
        type:
          $ref: '#/components/schemas/QuestionType'
        required:
          type: boolean
          default: false
        settings:
          $ref: '#/components/schemas/QuestionSettings'
        options:
          type: array
          maxItems: 100
          description: Dizi sırası = seçenek sırası; listede olmayan mevcut seçenekler silinir
          items:
            $ref: '#/components/schemas/OptionSaveInput'
    OptionSaveInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Mevcut seçenek için verilir; yeni seçenekte boş bırakılır
        label:
          type: string
          maxLength: 200

    # ---------- Question ----------
    QuestionType:
      type: string
      description: MVP soru tipleri. Yeni tipler (slider, matris vb.) eklendiğinde genişler (NFR-20).
      enum: [LIKERT, SINGLE_CHOICE, MULTIPLE_CHOICE, FREE_TEXT]
    Question:
      type: object
      description: Taslakta `text`, `type` ve `settings` boş olabilir (null alanlar yanıtta yer almaz).
      required: [id, number, required, options]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          description: Anket genelinde görünen soru numarası (1'den başlar); sıralama değişince güncellenir (FR-24)
        text:
          type: string
          nullable: true
        type:
          allOf:
            - $ref: '#/components/schemas/QuestionType'
          nullable: true
        required:
          type: boolean
        settings:
          allOf:
            - $ref: '#/components/schemas/QuestionSettings'
          nullable: true
          description: Tip seçiliyse varsayılanlarla tamamlanmış ayarlar
        options:
          type: array
          description: Yalnızca `SINGLE_CHOICE` ve `MULTIPLE_CHOICE` için dolu
          items:
            $ref: '#/components/schemas/Option'
    QuestionSettings:
      description: |
        Soru tipine özel ayarlar. Hangi şemanın geçerli olduğunu sorunun `type` alanı belirler
        (LIKERT → LikertSettings, SINGLE_CHOICE → SingleChoiceSettings, MULTIPLE_CHOICE → MultipleChoiceSettings,
        FREE_TEXT → FreeTextSettings); eşleşme sunucuda tipe göre doğrulanır.
      anyOf:
        - $ref: '#/components/schemas/LikertSettings'
        - $ref: '#/components/schemas/SingleChoiceSettings'
        - $ref: '#/components/schemas/MultipleChoiceSettings'
        - $ref: '#/components/schemas/FreeTextSettings'
    LikertSettings:
      type: object
      title: LikertSettings
      additionalProperties: false
      properties:
        scale:
          type: integer
          minimum: 3
          maximum: 10
          default: 5
        minLabel:
          type: string
          maxLength: 100
          default: Kesinlikle Katılmıyorum
        maxLabel:
          type: string
          maxLength: 100
          default: Kesinlikle Katılıyorum
    SingleChoiceSettings:
      type: object
      title: SingleChoiceSettings
      additionalProperties: false
      properties:
        allowOther:
          type: boolean
          default: false
          description: “Diğer” serbest metin alanı
        display:
          type: string
          enum: [RADIO, DROPDOWN]
          default: RADIO
    MultipleChoiceSettings:
      type: object
      title: MultipleChoiceSettings
      additionalProperties: false
      properties:
        allowOther:
          type: boolean
          default: false
        minSelect:
          type: integer
          minimum: 0
        maxSelect:
          type: integer
          minimum: 1
    FreeTextSettings:
      type: object
      title: FreeTextSettings
      additionalProperties: false
      properties:
        multiline:
          type: boolean
          default: false
        maxLength:
          type: integer
          minimum: 1
          maximum: 5000
          default: 1000
    Option:
      type: object
      required: [id, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
        sortOrder:
          type: integer

    # ---------- Users / Publish ----------
    UserSummary:
      type: object
      description: Ankete davet edilebilecek kullanıcı (`USER` rolünde, aktif)
      required: [id, fullName, email]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
    UserListResponse:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        page:
          $ref: '#/components/schemas/PageMeta'
    PublishSurveyRequest:
      type: object
      required: [surveyId, userIds]
      properties:
        surveyId:
          type: string
          format: uuid
        userIds:
          type: array
          minItems: 1
          maxItems: 1000
          description: Davet edilecek katılımcılar; tekrarlananlar tekilleştirilir
          items:
            type: string
            format: uuid
    PublishSurveyResponse:
      type: object
      required: [surveyId, status, publishedAt, invitationCount, invitations]
      properties:
        surveyId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SurveyStatus'
        publishedAt:
          type: string
          format: date-time
        invitationCount:
          type: integer
        invitations:
          type: array
          description: Geçici; e-posta gönderimi eklenince yanıttan çıkarılacak. Linkler hassastır.
          items:
            $ref: '#/components/schemas/InvitationLink'
      example:
        surveyId: 9a7d3c21-4b8e-4f0a-a1c2-7e5d9b3f2a68
        status: PUBLISHED
        publishedAt: '2026-11-03T12:00:00Z'
        invitationCount: 1
        invitations:
          - userId: 0a1b2c3d-0000-4000-8000-000000000101
            email: zeynep.kaya@definex.com
            fullName: Zeynep Kaya
            invitationUrl: http://localhost:3000/s/q7Zx0bR3kN9vYpL2mT6sWc1eHfJ4uAaD8gKiOn5rXyQ
    InvitationLink:
      type: object
      required: [userId, email, fullName, invitationUrl]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        invitationUrl:
          type: string
          description: Davete özel link; tek başına ankete erişim sağlar

    # ---------- Report ----------
    SurveyReport:
      type: object
      required: [surveyId, title, status, responseMode, generatedAt, summary, anonymityThresholdMet, questions]
      properties:
        surveyId:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/SurveyStatus'
        responseMode:
          $ref: '#/components/schemas/ResponseMode'
        endsAt:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/ReportSummary'
        anonymityThresholdMet:
          type: boolean
          description: '`false` ise `questions` boş döner (BR-07)'
        anonymityThreshold:
          type: integer
          example: 5
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionReport'
    ReportSummary:
      type: object
      description: Özet göstergeler (FR-70)
      required: [invitationCount, deliveredInvitationCount, responseCount, participationRate]
      properties:
        invitationCount:
          type: integer
        deliveredInvitationCount:
          type: integer
          description: Başarıyla gönderilen davet sayısı (katılım oranının paydası)
        responseCount:
          type: integer
        participationRate:
          type: number
          format: double
          minimum: 0
          maximum: 100
        averageSatisfactionScore:
          type: number
          format: double
          nullable: true
          description: Likert sorularının ortalaması; Likert soru yoksa `null`
        averageCompletionSeconds:
          type: integer
          nullable: true
    QuestionReport:
      oneOf:
        - $ref: '#/components/schemas/LikertQuestionReport'
        - $ref: '#/components/schemas/ChoiceQuestionReport'
        - $ref: '#/components/schemas/FreeTextQuestionReport'
      discriminator:
        propertyName: type
        mapping:
          LIKERT: '#/components/schemas/LikertQuestionReport'
          SINGLE_CHOICE: '#/components/schemas/ChoiceQuestionReport'
          MULTIPLE_CHOICE: '#/components/schemas/ChoiceQuestionReport'
          FREE_TEXT: '#/components/schemas/FreeTextQuestionReport'
    QuestionReportBase:
      type: object
      required: [questionId, number, text, type, answerCount]
      properties:
        questionId:
          type: string
          format: uuid
        number:
          type: integer
        text:
          type: string
        type:
          $ref: '#/components/schemas/QuestionType'
        answerCount:
          type: integer
    LikertQuestionReport:
      allOf:
        - $ref: '#/components/schemas/QuestionReportBase'
        - type: object
          required: [scale, average, distribution]
          properties:
            scale:
              type: integer
            average:
              type: number
              format: double
              nullable: true
            distribution:
              type: array
              items:
                type: object
                required: [value, count, percentage]
                properties:
                  value:
                    type: integer
                  label:
                    type: string
                    nullable: true
                  count:
                    type: integer
                  percentage:
                    type: number
                    format: double
    ChoiceQuestionReport:
      allOf:
        - $ref: '#/components/schemas/QuestionReportBase'
        - type: object
          required: [options]
          properties:
            options:
              type: array
              description: Çoklu seçimde yüzdeler soruyu yanıtlayan kişi sayısına göre hesaplanır, toplam %100'ü aşabilir
              items:
                type: object
                required: [optionId, label, count, percentage]
                properties:
                  optionId:
                    type: string
                    format: uuid
                  label:
                    type: string
                  count:
                    type: integer
                  percentage:
                    type: number
                    format: double
            otherCount:
              type: integer
              description: “Diğer” seçilen yanıt sayısı
    FreeTextQuestionReport:
      allOf:
        - $ref: '#/components/schemas/QuestionReportBase'
        - type: object
          required: [latestAnswers]
          properties:
            latestAnswers:
              type: array
              description: En yeni `textAnswerLimit` adet yanıt. Metinler ham döner; istemci HTML kaçışı uygulamalıdır (NFR-05)
              items:
                type: object
                required: [text, submittedAt]
                properties:
                  text:
                    type: string
                  submittedAt:
                    type: string
                    format: date-time

    ReportDownloadRequest:
      type: object
      required: [format]
      properties:
        format:
          type: string
          enum: [CSV, PDF]
    ExportJobAccepted:
      type: object
      required: [exportId, status, format]
      properties:
        exportId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, RUNNING]
        format:
          type: string
          enum: [CSV, PDF]
        message:
          type: string
          example: Dosya hazırlanıyor; hazır olduğunda e-posta ile bilgilendirileceksiniz.

    # ---------- User Survey ----------
    UserSurvey:
      type: object
      description: Katılımcıya gösterilen anket formu (S-08)
      required: [id, title, responseMode, endsAt, questions, totalQuestionCount]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        responseMode:
          $ref: '#/components/schemas/ResponseMode'
        anonymousNotice:
          type: string
          nullable: true
          description: Anonim modda formun başında gösterilecek bilgilendirme metni (FR-67); kayıtlı modda `null`
          example: Yanıtlarınız anonim olarak toplanmaktadır; kimliğinizle ilişkilendirilmez.
        endsAt:
          type: string
          format: date-time
        totalQuestionCount:
          type: integer
          description: İlerleme çubuğu için toplam soru sayısı (FR-61)
        questions:
          type: array
          description: Sorular görüntüleme sırasıyla
          items:
            $ref: '#/components/schemas/UserQuestion'
        draft:
          allOf:
            - $ref: '#/components/schemas/UserDraft'
          nullable: true
          description: Daha önce ara kayıt yapıldıysa dolu döner
    UserQuestion:
      type: object
      required: [id, number, text, type, required, settings]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
        text:
          type: string
        type:
          $ref: '#/components/schemas/QuestionType'
        required:
          type: boolean
          description: '`true` ise formda “*” ile gösterilir (FR-25)'
        settings:
          $ref: '#/components/schemas/QuestionSettings'
        options:
          type: array
          items:
            $ref: '#/components/schemas/UserOption'
    UserOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
    UserDraft:
      type: object
      required: [answers, savedAt]
      properties:
        currentQuestionId:
          type: string
          format: uuid
          nullable: true
          description: Katılımcının kaldığı soru
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerInput'
        savedAt:
          type: string
          format: date-time
    AnswerInput:
      type: object
      required: [questionId]
      description: |
        Soru tipine göre tek bir değer alanı doldurulur:
        | Tip | Alan |
        |---|---|
        | `LIKERT` | `numericValue` (1..scale) |
        | `SINGLE_CHOICE` | `optionIds` (tek eleman) ve/veya `otherText` |
        | `MULTIPLE_CHOICE` | `optionIds` (minSelect..maxSelect) ve/veya `otherText` |
        | `FREE_TEXT` | `text` (≤ maxLength) |
      properties:
        questionId:
          type: string
          format: uuid
        numericValue:
          type: integer
          minimum: 1
          maximum: 10
        optionIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        otherText:
          type: string
          maxLength: 500
          description: “Diğer” seçeneği için serbest metin
        text:
          type: string
          maxLength: 5000
    UserDraftRequest:
      type: object
      required: [answers]
      properties:
        currentQuestionId:
          type: string
          format: uuid
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerInput'
    UserDraftResponse:
      type: object
      required: [savedAt, answeredCount, totalQuestionCount]
      properties:
        savedAt:
          type: string
          format: date-time
        answeredCount:
          type: integer
        totalQuestionCount:
          type: integer
    UserSubmitRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerInput'
    UserSubmitResponse:
      type: object
      description: Teşekkür ekranı (S-09) için
      required: [submittedAt, message]
      properties:
        submittedAt:
          type: string
          format: date-time
        message:
          type: string
          example: Cevaplarınız başarıyla gönderildi. Katılımınız için teşekkür ederiz.
