# Ortak yapılandırma. Gizli bilgiler (DB şifresi, JWT secret) yalnızca environment variable'dan okunur.
spring:
  application:
    name: survey-api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/survey}
    username: ${DB_USERNAME:survey}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
  # SMTP (davet e-postaları). Kullanıcı ve şifre yalnızca environment variable'dan okunur.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-stacktrace: never
    include-message: never

# Swagger UI varsayılan olarak kapalı; dev profilinde açılır.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: survey-api
      access-token-ttl: 15m
    auth:
      session-idle-timeout: ${AUTH_SESSION_IDLE_TIMEOUT:30m}
      session-max-lifetime: 7d
      max-failed-attempts-per-ip: ${AUTH_MAX_FAILED_ATTEMPTS_PER_IP:5}
      max-failed-attempts-per-account: ${AUTH_MAX_FAILED_ATTEMPTS_PER_ACCOUNT:20}
      lock-duration: 15m
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend:
    # Davet linki = base-url + "/s/" + token
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    # Link token içerdiği için yalnızca dev profilinde log'a yazılır
    log-invitation-links: false
  survey:
    expiry-check-interval: 60s
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:Survey Tool}
    # Bu süreden uzun SENDING'de kalan mail takılı sayılır ve yeniden gönderilebilir
    stuck-after: 10m
