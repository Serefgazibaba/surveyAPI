server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API istekleri backend container'ına (compose servis adı: api)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # İstemcinin gönderdiği X-Forwarded-For atılır (taklit edilemesin); yalnızca gerçek bağlantı IP'si iletilir
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hash'li statik dosyalar uzun süre önbelleğe alınır
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: bilinmeyen yollar (ör. /s/{token} davet linki, /admin/...) index.html'e düşer
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
